# Orb Version 0.1.0

version: 2.1
description: >
  Run Semgrep and OSV-Scanner static analysis in CI and store the SARIF
  reports as job artifacts for DefectDojo. Findings never gate the build.

executors:
  scanner:
    machine:
      image: ubuntu-2404:current
    resource_class: medium

commands:
  semgrep-scan:
    description: Run Semgrep against the checkout and write a SARIF report.
    parameters:
      output-file:
        type: string
        default: reports/semgrep.sarif
    steps:
      - run:
          name: Semgrep (SAST)
          command: |
            mkdir -p "$(dirname "<< parameters.output-file >>")"
            docker run --rm --entrypoint semgrep -v "$PWD:/src" -w /src \
              semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --sarif \
              --output "<< parameters.output-file >>" \
              --metrics off \
              --disable-version-check \
              .

  osv-scan:
    description: Run OSV-Scanner against the checkout and write a SARIF report.
    parameters:
      output-file:
        type: string
        default: reports/osv.sarif
    steps:
      - run:
          name: OSV-Scanner (SCA)
          command: |
            mkdir -p "$(dirname "<< parameters.output-file >>")"
            # osv-scanner exits 1 when it finds vulnerabilities; only that is tolerated.
            # --allow-no-lockfiles: repos with nothing to scan exit 0 (else 128, no SARIF).
            docker run --rm -v "$PWD:/src" -w /src \
              ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde scan source -r . \
              --allow-no-lockfiles --format sarif \
              --output-file "<< parameters.output-file >>" || [ "$?" -eq 1 ]

jobs:
  sast:
    description: Run Semgrep + OSV-Scanner and store the SARIF reports as artifacts.
    executor: scanner
    steps:
      - checkout
      - semgrep-scan
      - osv-scan
      - store_artifacts:
          path: reports

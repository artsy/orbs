# Orb Version 3.0.0

version: 2.1
description: Publish NPM packages and canary deployments with Intuit's Auto
orbs:
  yarn: artsy/yarn@5.1.3
  auto: auto/release@0.2.3
  utils: artsy/orb-tools@0.5.0
executors:
  node:
    parameters:
      node-version:
        type: string
        default: "22.23.4"
    docker:
      - image: cimg/node:<< parameters.node-version >>
commands:
  # npm trusted publishing (OIDC): https://docs.npmjs.com/trusted-publishers
  # Needs Node >= 22.14 and npm >= 11.5.1. npm tries OIDC first and falls back
  # to NPM_TOKEN, so packages without a trusted publisher keep working.
  setup-npm-trusted-publishing:
    steps:
      - run:
          name: Install npm with trusted publishing support
          command: sudo npm install -g npm@11.20.0
      - run:
          name: Get npm OIDC token
          command: |
            echo "export NPM_ID_TOKEN=\"\$(circleci run oidc get --claims '{\"aud\": \"npm:registry.npmjs.org\"}')\"" >> "$BASH_ENV"
jobs:
  publish:
    parameters:
      node-version:
        type: string
        default: "22.23.4"
      version:
        type: string
        default: v11.3.0
      args:
        type: string
        default: ""
    executor:
      name: node
      node-version: << parameters.node-version >>
    environment:
      AUTO_VERSION: << parameters.version >>
    steps:
      - yarn/pre-release
      - setup-npm-trusted-publishing
      - auto/shipit:
          arguments: << parameters.args >>
  publish-canary:
    parameters:
      node-version:
        type: string
        default: "22.23.4"
      version:
        type: string
        default: v11.3.0
      args:
        type: string
        default: ""
    executor:
      name: node
      node-version: << parameters.node-version >>
    environment:
      AUTO_VERSION: << parameters.version >>
    steps:
      - utils/skip-if-fork-or-not-pr:
          pr-skip-message: Skipping, only deploys canaries on PR builds
          fork-skip-message: Skipping, can't deploy canaries from a fork
      - yarn/pre-release
      - setup-npm-trusted-publishing
      - auto/canary:
          arguments: << parameters.args >>
